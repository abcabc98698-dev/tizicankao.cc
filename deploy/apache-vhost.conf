# ==============================================================================
# 梯子参考 tizicankao.cc - Apache 2.4 VirtualHost 生产服务器虚拟主机配置
# ==============================================================================

# HTTP (端口 80) 全局 301 永久重定向至 HTTPS
<VirtualHost *:80>
    ServerName tizicankao.cc
    ServerAlias www.tizicankao.cc
    ServerAdmin webmaster@tizicankao.cc

    # 强制跳转 HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://tizicankao.cc$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/tizicankao_error.log
    CustomLog ${APACHE_LOG_DIR}/tizicankao_access.log combined
</VirtualHost>

# HTTPS (端口 443) 静态网站根配置
<VirtualHost *:443>
    ServerName tizicankao.cc
    ServerAlias www.tizicankao.cc
    ServerAdmin webmaster@tizicankao.cc

    # 静态编译产物 DocumentRoot 目录
    DocumentRoot /var/www/tizicankao.cc/dist

    <Directory /var/www/tizicankao.cc/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SSL 证书配置 (生产环境填写真实 Let's Encrypt 证书路径)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tizicankao.cc/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tizicankao.cc/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # HSTS (HTTP Strict Transport Security) 强安全传输保护
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # 日志记录规范
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/tizicankao_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/tizicankao_ssl_access.log combined
</VirtualHost>
